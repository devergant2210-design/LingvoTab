name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: |
          if [ ! -d android ]; then
            flutter create . --platforms=android --project-name lingvotab --org uz.lingvotab
          fi
          rm -rf test

      - name: Add permissions to AndroidManifest
        run: |
          python3 - <<'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          perms = ''
          for n in ['INTERNET', 'RECORD_AUDIO', 'CAMERA']:
              tag = f'<uses-permission android:name="android.permission.{n}"/>'
              if tag not in s:
                  perms += tag + '\n    '
          s = s.replace('<application', perms + '<application', 1)
          q = '<intent><action android:name="android.speech.RecognitionService"/></intent>'
          if q not in s:
              if '<queries>' in s:
                  s = s.replace('<queries>', '<queries>\n        ' + q, 1)
              else:
                  s = s.replace('</manifest>', '    <queries>' + q + '</queries>\n</manifest>', 1)
          open(p, 'w', encoding='utf-8').write(s)
          PY

      - run: flutter pub get

      - name: Build release APK
        run: >
          flutter build apk --release
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: lingvotab-apk
          path: build/app/outputs/flutter-apk/app-release.apk
